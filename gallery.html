<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Gallery | Pink City Cafe</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      darkMode: "media"
    }
  </script>

</head>


<body class="bg-white text-gray-800 dark:bg-gray-950 dark:text-gray-100">


  <!-- HEADER -->
<header class="sticky top-0 z-50 bg-white/95 backdrop-blur
               border-b border-gray-200
               dark:bg-gray-950/95 dark:border-gray-800">

  <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

    <div class="h-16 flex items-center justify-between">

      <!-- Logo -->
      <a href="index.html"
         class="text-xl sm:text-2xl font-bold text-pink-600">
        Pink City Cafe
      </a>

      <!-- Navigation -->
<div class="flex items-center gap-4 sm:gap-7">

  <a href="index.html"
     class="text-sm sm:text-base font-medium
            hover:text-pink-600 transition">
    Home
  </a>

  <a href="services.html"
     class="text-sm sm:text-base font-medium
            hover:text-pink-600 transition">
    Services
  </a>

  <a href="gallery.html"
     class="text-sm sm:text-base font-medium
            hover:text-pink-600 transition">
    Gallery
  </a>

  <a href="contact.html"
     class="text-sm sm:text-base font-medium
            hover:text-pink-600 transition">
    Contact
  </a>

</div>

    </div>

  </nav>

</header>


  <main>

    <!-- HERO -->

    <section class="bg-pink-50 dark:bg-gray-900">

      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8
                  py-14 sm:py-20 text-center">

        <p class="text-pink-600 font-semibold">
          Our Gallery
        </p>

        <h1 class="text-4xl sm:text-5xl font-bold mt-2">
          Moments at Pink City Cafe
        </h1>

        <p class="max-w-2xl mx-auto mt-4
                  text-gray-600 dark:text-gray-300">
          Take a look at our food, ambience and memorable moments.
        </p>

      </div>

    </section>


    <!-- IMAGE GRID -->

    <section class="py-12 sm:py-16">

      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

        <div class="grid grid-cols-1 sm:grid-cols-2
                    lg:grid-cols-3 gap-4">


          <img
            src="https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1000&q=80"
            alt="Cafe interior"
            class="w-full h-72 object-cover rounded-2xl
                   hover:scale-[1.02] transition duration-300">


          <img
            src="https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=1000&q=80"
            alt="Cafe dining area"
            class="w-full h-72 object-cover rounded-2xl
                   hover:scale-[1.02] transition duration-300">


          <img
            src="https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=1000&q=80"
            alt="Coffee cup on cafe table"
            class="w-full h-72 object-cover rounded-2xl
                   hover:scale-[1.02] transition duration-300">


          <img
            src="https://images.unsplash.com/photo-1579751626657-72bc17010498?auto=format&fit=crop&w=1000&q=80"
            alt="Fresh pizza served at cafe"
            class="w-full h-72 object-cover rounded-2xl
                   hover:scale-[1.02] transition duration-300">


          <img
            src="https://images.unsplash.com/photo-1551024506-0bccd828d307?auto=format&fit=crop&w=1000&q=80"
            alt="Fresh dessert"
            class="w-full h-72 object-cover rounded-2xl
                   hover:scale-[1.02] transition duration-300">


          <img
            src="https://images.unsplash.com/photo-1521017432531-fbd92d768814?auto=format&fit=crop&w=1000&q=80"
            alt="People enjoying food at cafe"
            class="w-full h-72 object-cover rounded-2xl
                   hover:scale-[1.02] transition duration-300">

        </div>

      </div>

    </section>


    <!-- CTA -->

    <section class="pb-16">

      <div class="max-w-5xl mx-auto px-4">

        <div class="bg-pink-600 text-white rounded-3xl
                    text-center p-8 sm:p-12">

          <h2 class="text-3xl font-bold">
            Want to Visit Us?
          </h2>

          <a href="contact.html"
             class="inline-block mt-6 bg-white
                    text-pink-600 px-6 py-3
                    rounded-full font-semibold
                    hover:bg-gray-100">
            Contact Us
          </a>

        </div>

      </div>

    </section>

  </main>


  <footer class="bg-gray-950 text-gray-300">

    <div class="max-w-7xl mx-auto px-4 py-8 text-center">

      © 2026 Pink City Cafe. All rights reserved.

    </div>

  </footer>

</body>
</html>
